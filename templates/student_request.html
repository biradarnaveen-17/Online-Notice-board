<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Send Notice Request</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light p-5">
<div class="container col-md-6">
    <div class="card shadow">
        <div class="card-header bg-primary text-white"><h4>Submit New Request</h4></div>
        <div class="card-body">
            
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                    <div class="alert alert-{{ category or 'info' }}">{{ message }}</div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form method="POST" action="{{ url_for('send_request') }}" enctype="multipart/form-data">
                <div class="mb-3">
                    <label>Your Full Name</label>
                    <input type="text" name="name" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label>Contact Email / Phone</label>
                    <input type="text" name="contact" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label>Department / Club</label>
                    <input type="text" name="department" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label>Notice Content / Message</label>
                    <textarea name="message" class="form-control" rows="4" required></textarea>
                </div>
                 <div class="mb-3">
                    <label>Attachment (Image or Document)</label>
                    <input type="file" name="media" class="form-control">
                </div>
                <button type="submit" class="btn btn-primary w-100">Send Request to Admin</button>
                <a href="{{ url_for('home') }}" class="btn btn-link w-100 mt-2">Back to Notice Board</a>
            </form>
        </div>
    </div>
</div>
</body>
</html>
