<!DOCTYPE html>
<html lang="en">
<head><title>Reset Password</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"></head>
<body class="d-flex justify-content-center align-items-center vh-100 bg-light">
    <div class="card p-5 shadow" style="width:400px;">
        <h4 class="text-center mb-4">New Password</h4>
        {% with messages = get_flashed_messages() %}
            {% if messages %}<div class="alert alert-danger py-2 small">{{ messages[0] }}</div>{% endif %}
        {% endwith %}
        <form method="POST">
            <input type="password" name="password" class="form-control mb-3" placeholder="New Password" required>
            <input type="password" name="confirm" class="form-control mb-4" placeholder="Confirm Password" required>
            <button class="btn btn-primary w-100 btn-lg">Update Password</button>
        </form>
    </div>
</body></html>
