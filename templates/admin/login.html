<!DOCTYPE html>
<html lang="en">
<head><title>Login</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"></head>
<body class="d-flex justify-content-center align-items-center vh-100 bg-light">
    <div class="card p-4 shadow" style="width:350px;">
        <h3 class="text-center">Admin Login</h3>
        {% with messages = get_flashed_messages() %}
            {% if messages %}<div class="alert alert-info">{{ messages[0] }}</div>{% endif %}
        {% endwith %}
        <form method="POST">
            <input type="text" name="username" class="form-control mb-2" placeholder="Username" required>
            <input type="password" name="password" class="form-control mb-3" placeholder="Password" required>
            <button class="btn btn-dark w-100">Login</button>
        </form>
        <hr>
        <form action="/admin/forgot_password" method="POST" style="text-align:center;">
            <p class="small mb-1">Forgot Password?</p>
            <div class="input-group input-group-sm">
                <input type="text" name="username" class="form-control" placeholder="Enter Username">
                <button class="btn btn-outline-secondary">Send Code</button>
            </div>
        </form>
    </div>
</body></html>
