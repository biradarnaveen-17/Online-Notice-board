<!DOCTYPE html>
<html lang="en">
<head><title>Edit Profile</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"></head>
<body class="bg-light p-5"><div class="card col-md-6 mx-auto p-4">
    <h3>Edit Profile</h3>
    <form method="POST" enctype="multipart/form-data">
        <input type="text" name="full_name" class="form-control mb-2" value="{{ current_user.full_name or '' }}" placeholder="Full Name">
        <input type="email" name="email" class="form-control mb-2" value="{{ current_user.email or '' }}" placeholder="Email">
        <textarea name="bio" class="form-control mb-2" placeholder="Bio">{{ current_user.bio or '' }}</textarea>
        <label>Profile Pic:</label><input type="file" name="profile_pic" class="form-control mb-3">
        <button class="btn btn-success w-100">Save</button>
        <a href="/admin/dashboard" class="btn btn-link w-100">Cancel</a>
    </form>
</div></body></html>
