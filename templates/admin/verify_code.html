<!DOCTYPE html>
<html lang="en">
<head><title>Verify Code</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"></head>
<body class="d-flex justify-content-center align-items-center vh-100 bg-light">
    <div class="card p-5 shadow" style="width:400px;">
        <h4 class="text-center mb-4">Verify Identity</h4>
        <p class="text-center text-muted small mb-4">We sent a 4-digit code to your email.</p>
        {% with messages = get_flashed_messages() %}
            {% if messages %}<div class="alert alert-danger py-2 small">{{ messages[0] }}</div>{% endif %}
        {% endwith %}
        <form method="POST">
            <input type="text" name="code" class="form-control form-control-lg text-center mb-4" placeholder="X X X X" maxlength="4" required style="letter-spacing: 5px; font-size: 1.5rem;">
            <button class="btn btn-success w-100 btn-lg">Verify</button>
        </form>
    </div>
</body></html>
