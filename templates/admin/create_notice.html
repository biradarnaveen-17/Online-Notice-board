<!DOCTYPE html>
<html lang="en">
<head><title>Create</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"></head>
<body class="bg-light p-5">
    <div class="card shadow col-md-8 mx-auto">
        <div class="card-body">
            <h3>New Notice</h3>
            <form method="POST" enctype="multipart/form-data">
                <div class="mb-2"><label>Title</label><input type="text" name="title" class="form-control" required></div>
                
                <div class="row">
                    <div class="col-md-6 mb-2">
                        <label>Category</label>
                        <select name="category" class="form-select">
                            <option value="Academics">Academics</option><option value="Placement">Placement</option>
                            <option value="Cultural">Cultural</option><option value="Sports">Sports</option>
                            <option value="Administrative">Administrative</option><option value="Exam">Exam</option>
                        </select>
                    </div>
                    <div class="col-md-6 mb-2">
                        <label>Type</label>
                        <select name="type" id="typeSelector" class="form-select" onchange="toggleFields()">
                            <option value="text">Text Only</option>
                            <option value="image">Image + Text</option>
                            <option value="video">Video + Text</option>
                        </select>
                    </div>
                </div>

                <!-- Colors (For Text Only) -->
                <div id="colorFields" class="row mb-2">
                    <div class="col-md-6">
                        <label>Background Color</label>
                        <input type="color" name="bg_color" class="form-control form-control-color w-100" value="#000000">
                    </div>
                    <div class="col-md-6">
                        <label>Text Color</label>
                        <input type="color" name="text_color" class="form-control form-control-color w-100" value="#ffffff">
                    </div>
                </div>

                <div class="mb-2"><label>Content</label><textarea name="content" class="form-control" rows="3"></textarea></div>
                
                <div class="mb-2" id="mediaField" style="display:none;">
                    <label>Background Media:</label><input type="file" name="file" class="form-control">
                </div>
                
                <div class="mb-2"><label>Link (Optional):</label><input type="url" name="link" class="form-control"></div>
                <div class="mb-2"><label>Attachment (PDF):</label><input type="file" name="attachment" class="form-control"></div>
                <div class="mb-2"><label>Auto-Delete Date:</label><input type="date" name="expiration_date" class="form-control"></div>
                <div class="mb-3"><label>Duration (Secs):</label><input type="number" name="duration" class="form-control" value="5"></div>
                <button class="btn btn-primary w-100">Publish</button>
            </form>
        </div>
    </div>

    <script>
        function toggleFields() {
            const type = document.getElementById('typeSelector').value;
            const mediaField = document.getElementById('mediaField');
            const colorFields = document.getElementById('colorFields');

            if (type === 'text') {
                mediaField.style.display = 'none';
                colorFields.style.display = 'flex';
            } else {
                mediaField.style.display = 'block';
                colorFields.style.display = 'none';
            }
        }
        // Run on load
        toggleFields();
    </script>
</body>
</html>
